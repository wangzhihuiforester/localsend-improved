name: localsend_isolates
description: LocalSend network isolates and Rust bindings
publish_to: "none"

version: 0.0.1

environment:
  flutter: ^3.22.0
  sdk: ^3.4.0

dependencies:
  collection: 1.18.0 # allow newer versions, so it can compile with newer Flutter versions
  dart_mappable: ^4.2.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^8.0.0
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^2.4.0
  logging: 1.3.0
  mime: ^1.0.0
  path: 1.9.0
  pool: 1.5.2
  refena_flutter: 3.3.0
  rust_lib_localsend_app:
    path: rust_builder
  typed_isolates:
    path: ../typed_isolates
  uuid: ^4.4.0

dev_dependencies:
  build_runner: 2.4.11
  dart_mappable_builder: ^4.2.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.0
