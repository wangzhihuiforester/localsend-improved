name: Build Improved LocalSend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.93.1"
  NDK_VERSION: "28.2.13676358"

jobs:
  build_windows:
    name: Windows Portable + Installer
    runs-on: windows-2022

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Add Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Run code generators
        working-directory: app
        continue-on-error: true
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release

      - name: Add VCRedist DLLs and settings
        shell: pwsh
        run: |
          $release = "app/build/windows/x64/runner/Release"
          $dllSource = "support/build/windows/x64"
          if (Test-Path "$dllSource/msvcp140.dll") {
            Copy-Item "$dllSource/msvcp140.dll" "$release/"
            Copy-Item "$dllSource/vcruntime140.dll" "$release/"
            Copy-Item "$dllSource/vcruntime140_1.dll" "$release/"
          }
          if (-not (Test-Path "$release/settings.json")) {
            '{}' | Out-File "$release/settings.json" -Encoding utf8
          }

      - name: Create portable zip
        shell: pwsh
        run: |
          $release = "app/build/windows/x64/runner/Release"
          Compress-Archive -Path "$release/*" -DestinationPath "LocalSend_Windows_Portable.zip"

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-zip
          path: LocalSend_Windows_Portable.zip
          retention-days: 30

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build EXE installer
        shell: pwsh
        run: |
          $releaseDir = "app/build/windows/x64/runner/Release"
          $iconFile = "app/assets/packaging/logo.ico"
          if (-not (Test-Path $iconFile)) {
            $iconFile = "app/windows/runner/resources/app_icon.ico"
          }

          # Get version from pubspec.yaml
          $pubspec = Get-Content "app/pubspec.yaml" -Raw
          $versionMatch = [regex]::Match($pubspec, 'version:\s*(\d+\.\d+\.\d+)')
          $appVersion = if ($versionMatch.Success) { $versionMatch.Groups[1].Value } else { "1.0.0" }

          $issContent = @"
          [Setup]
          AppName=LocalSend
          AppVersion=$appVersion
          AppPublisher=LocalSend
          DefaultDirName={autopf}\LocalSend
          DisableProgramGroupPage=yes
          PrivilegesRequiredOverridesAllowed=dialog
          OutputDir=installer-output
          OutputBaseFilename=LocalSend-Setup
          SetupIconFile=$iconFile
          UninstallDisplayIcon={app}\localsend_app.exe
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64compatible
          ArchitecturesAllowed=x64compatible

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Files]
          Source: "$releaseDir\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\LocalSend"; Filename: "{app}\localsend_app.exe"
          Name: "{autodesktop}\LocalSend"; Filename: "{app}\localsend_app.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\localsend_app.exe"; Description: "{cm:LaunchProgram,LocalSend}"; Flags: nowait postinstall skipifsilent
          "@

          $issContent | Out-File -FilePath "build_installer.iss" -Encoding UTF8
          $innoPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $innoPath)) {
            $innoPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (Test-Path $innoPath) {
            & "$innoPath" "build_installer.iss"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "EXE installer built successfully"
            } else {
              Write-Host "EXE installer build failed (non-fatal)"
            }
          } else {
            Write-Host "Inno Setup not found, skipping EXE installer"
          }

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-installer
          path: |
            installer-output/*.exe
            *.exe
          if-no-files-found: ignore
          retention-days: 30

  build_apk:
    name: Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          sudo rm -rf /opt/az /opt/microsoft /opt/pipx
          sudo apt-get clean
          sudo apt-get autoremove -y
          docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install Android NDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Generate signing keystore
        working-directory: app/android/app
        run: |
          mkdir -p secrets
          keytool -genkeypair -v \
            -keystore secrets/android-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass localsend -keypass localsend \
            -dname "CN=LocalSend, OU=Local, O=Local, L=Local, ST=Local, C=CN"
          cat > ../key.properties <<'EOF'
          storePassword=localsend
          keyPassword=localsend
          keyAlias=upload
          storeFile=secrets/android-keystore.jks
          EOF

      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Run code generators
        working-directory: app
        continue-on-error: true
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Free up space before APK build
        run: |
          rm -rf ~/.cargo/registry/cache ~/.cargo/registry/src
          rm -rf /home/runner/.rustup/toolchains/*/share/doc
          df -h /

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64,android-x64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build_linux:
    name: Linux Portable
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Run code generators
        working-directory: app
        continue-on-error: true
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Build Linux release
        working-directory: app
        run: flutter build linux --release

      - name: Create tar.gz archive
        run: |
          cd app/build/linux/x64/release/bundle
          tar -czvf "${{ github.workspace }}/LocalSend_Linux_Portable.tar.gz" .

      - name: Upload Linux portable
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: LocalSend_Linux_Portable.tar.gz
          retention-days: 30
