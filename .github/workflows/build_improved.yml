name: Build Improved LocalSend

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.93.1"
  NDK_VERSION: "28.2.13676358"

jobs:
  build_windows:
    name: Windows 绿色版 (zip)
    runs-on: windows-latest

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Run code generators
        working-directory: app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release

      - name: Create portable zip
        shell: pwsh
        run: |
          $release = "app/build/windows/x64/runner/Release"
          Compress-Archive -Path "$release/*" -DestinationPath "LocalSend_Windows_Portable.zip"

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v6
        with:
          name: windows-portable
          path: LocalSend_Windows_Portable.zip

  build_apk:
    name: Android APK
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Generate signing keystore
        working-directory: app/android
        run: |
          mkdir -p secrets
          keytool -genkeypair -v \
            -keystore secrets/android-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass localsend -keypass localsend \
            -dname "CN=LocalSend, OU=Local, O=Local, L=Local, ST=Local, C=CN"
          cat > key.properties <<'EOF'
          storePassword=localsend
          keyPassword=localsend
          keyAlias=upload
          storeFile=secrets/android-keystore.jks
          EOF

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Run code generators
        working-directory: app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/*.apk
