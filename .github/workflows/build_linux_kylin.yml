name: Build Linux (Kylin Compatible)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build_linux_kylin.yml'
      - 'app/**'
      - 'packages/**'

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.93.1"

jobs:
  # Job 1: Build on Ubuntu 20.04 for lower glibc (2.31)
  build_ubuntu_2004:
    name: Linux (Ubuntu 20.04 / glibc 2.31)
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libgtk-3-dev ninja-build pkg-config \
            libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev \
            libayatana-appindicator3-1 libayatana-ido3-0.4-0 \
            libglib2.0-0 libglib2.0-dev \
            libgraphite2-3 libgraphite2-dev \
            libxdamage1 libxcomposite1 libxcursor1 libxinerama1 libxrandr2 \
            libxi6 libxtst6 libxfixes3 libxrender1 libxext6 libx11-6 \
            libgbm1 libdrm2 libegl1 libgl1 libgles2 \
            libnss3 libnspr4 \
            libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdbus-1-3 \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libcairo-gobject2 \
            libfribidi0 libthai0 \
            libfontconfig1 libfreetype6 \
            libgdk-pixbuf-2.0-0 libgdk-pixbuf2.0-dev \
            libwayland-client0 libwayland-server0 libwayland-egl1 \
            libxkbcommon0 \
            fonts-noto-cjk fonts-wqy-microhei fonts-wqy-zenhei \
            libstdc++6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Run code generators
        working-directory: app
        continue-on-error: true
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Build Linux release
        working-directory: app
        run: flutter build linux --release

      - name: Check glibc symbol requirements
        shell: bash
        continue-on-error: true
        run: |
          echo "=== GLIBC symbol requirements ==="
          BUNDLE_DIR="app/build/linux/x64/release/bundle"
          readelf -V "$BUNDLE_DIR/localsend_app" 2>/dev/null | grep -E "GLIBC|Name" | head -30
          echo ""
          echo "=== libstdc++ symbol requirements ==="
          readelf -V "$BUNDLE_DIR/localsend_app" 2>/dev/null | grep -E "GLIBCXX|CXXABI" | head -20
          echo ""
          echo "=== ldd output ==="
          ldd "$BUNDLE_DIR/localsend_app" 2>/dev/null || true

      - name: Bundle ALL shared libraries
        shell: bash
        run: |
          set +e
          BUNDLE_DIR="app/build/linux/x64/release/bundle"
          mkdir -p "$BUNDLE_DIR/lib"
          
          # Copy ALL dependencies of the main binary
          echo "=== Copying all binary dependencies ==="
          ldd "$BUNDLE_DIR/localsend_app" 2>/dev/null | grep "=>" | awk '{print $3}' | while read -r lib_path; do
            if [ -n "$lib_path" ] && [ -f "$lib_path" ]; then
              lib_name=$(basename "$lib_path")
              cp "$lib_path" "$BUNDLE_DIR/lib/" 2>/dev/null
              [ $? -eq 0 ] && echo "  Copied: $lib_name"
            fi
          done
          true
          
          # Also copy the Rust shared library dependencies
          echo "=== Copying Rust library dependencies ==="
          find "$BUNDLE_DIR" -name "*.so" -not -path "*/lib/*" 2>/dev/null | while read -r so_file; do
            echo "  Checking: $so_file"
            ldd "$so_file" 2>/dev/null | grep "=>" | awk '{print $3}' | while read -r lib_path; do
              if [ -n "$lib_path" ] && [ -f "$lib_path" ]; then
                lib_name=$(basename "$lib_path")
                if [ ! -f "$BUNDLE_DIR/lib/$lib_name" ]; then
                  cp "$lib_path" "$BUNDLE_DIR/lib/" 2>/dev/null
                  [ $? -eq 0 ] && echo "    Copied: $lib_name"
                fi
              fi
            done
          done
          true
          
          # Copy dependencies of bundled .so files (recursive)
          echo "=== Copying recursive dependencies ==="
          for i in 1 2 3; do
            find "$BUNDLE_DIR/lib" -name "*.so*" 2>/dev/null | while read -r so_file; do
              ldd "$so_file" 2>/dev/null | grep "=>" | awk '{print $3}' | while read -r lib_path; do
                if [ -n "$lib_path" ] && [ -f "$lib_path" ]; then
                  lib_name=$(basename "$lib_path")
                  if [ ! -f "$BUNDLE_DIR/lib/$lib_name" ]; then
                    cp "$lib_path" "$BUNDLE_DIR/lib/" 2>/dev/null
                    [ $? -eq 0 ] && echo "  Copied (pass $i): $lib_name"
                  fi
                fi
              done
            done
            true
          done
          
          # Copy libstdc++ explicitly
          echo "=== Copying libstdc++ ==="
          find /usr/lib /lib -name "libstdc++.so*" 2>/dev/null | while read -r stdc; do
            cp "$stdc" "$BUNDLE_DIR/lib/" 2>/dev/null
            [ $? -eq 0 ] && echo "  Copied: $(basename $stdc)"
          done
          true
          
          # Copy libgcc_s explicitly
          echo "=== Copying libgcc_s ==="
          find /usr/lib /lib -name "libgcc_s.so*" 2>/dev/null | while read -r gccs; do
            cp "$gccs" "$BUNDLE_DIR/lib/" 2>/dev/null
            [ $? -eq 0 ] && echo "  Copied: $(basename $gccs)"
          done
          true
          
          echo "=== Final bundled libraries ==="
          ls -la "$BUNDLE_DIR/lib/" 2>/dev/null
          echo ""
          echo "Total libraries: $(ls "$BUNDLE_DIR/lib/" 2>/dev/null | wc -l)"

      - name: Create launch script with detailed diagnostics
        shell: bash
        run: |
          BUNDLE_DIR="app/build/linux/x64/release/bundle"
          cat > "$BUNDLE_DIR/localsend.sh" << 'SCRIPT'
#!/bin/bash

# LocalSend Linux launch script - Kylin OS Compatible
# This script sets up the runtime environment for maximum compatibility

set -e

# Get script directory
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

echo "=========================================="
echo "LocalSend Linux 启动脚本"
echo "=========================================="
echo "脚本目录: $SCRIPT_DIR"
echo "系统信息: $(uname -a)"
echo "glibc版本: $(ldd --version 2>&1 | head -1)"
echo ""

# Check if main binary exists
if [ ! -f "$SCRIPT_DIR/localsend_app" ]; then
    echo "ERROR: 找不到 localsend_app 可执行文件"
    echo "请确保完整解压了压缩包"
    exit 1
fi

# Set up library path
export LD_LIBRARY_PATH="${SCRIPT_DIR}/lib:${SCRIPT_DIR}:${LD_LIBRARY_PATH}"
echo "LD_LIBRARY_PATH: $LD_LIBRARY_PATH"

# Check bundled libraries
LIB_COUNT=$(ls "$SCRIPT_DIR/lib/"*.so* 2>/dev/null | wc -l)
echo "内置库数量: $LIB_COUNT"

# Set environment for maximum compatibility
export GDK_BACKEND=x11
export GTK_CSD=0
export QT_AUTO_SCREEN_SCALE_FACTOR=1
export GDK_PIXBUF_MODULEDIR=$(pkg-config --variable=gdk_pixbuf_moduledir gdk-pixbuf-2.0 2>/dev/null || echo "")
export GDK_PIXBUF_MODULE_FILE=$(pkg-config --variable=gdk_pixbuf_cache_file gdk-pixbuf-2.0 2>/dev/null || echo "")

# Check display
if [ -z "$DISPLAY" ] && [ -z "$WAYLAND_DISPLAY" ]; then
    echo "ERROR: 未检测到显示环境"
    echo "如果通过SSH连接，请使用: ssh -X user@host"
    exit 1
fi
echo "DISPLAY: ${DISPLAY:-未设置}"
echo "WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-未设置}"

# Check if the binary can load all libraries
echo ""
echo "=== 检查库依赖 ==="
MISSING_LIBS=$(ldd "$SCRIPT_DIR/localsend_app" 2>&1 | grep "not found" || true)
if [ -n "$MISSING_LIBS" ]; then
    echo "WARNING: 以下库缺失:"
    echo "$MISSING_LIBS"
    echo ""
    echo "尝试安装缺失的库..."
    
    # Try to detect package manager
    if command -v apt-get &>/dev/null; then
        echo "使用 apt-get 安装缺失依赖..."
        sudo apt-get update 2>/dev/null || true
        for lib in $(echo "$MISSING_LIBS" | awk '{print $1}'); do
            echo "  尝试安装 $lib 的包..."
            # Try to find which package provides this library
            PKG=$(dpkg -S "$lib" 2>/dev/null | cut -d: -f1 || true)
            if [ -n "$PKG" ]; then
                sudo apt-get install -y "$PKG" 2>/dev/null || true
            fi
        done
    elif command -v yum &>/dev/null; then
        echo "使用 yum 安装缺失依赖..."
        for lib in $(echo "$MISSING_LIBS" | awk '{print $1}'); do
            PKG=$(rpm -qf "$(find / -name "$lib" 2>/dev/null | head -1)" 2>/dev/null || true)
            if [ -n "$PKG" ]; then
                sudo yum install -y "$PKG" 2>/dev/null || true
            fi
        done
    elif command -v dnf &>/dev/null; then
        echo "使用 dnf 安装缺失依赖..."
        for lib in $(echo "$MISSING_LIBS" | awk '{print $1}'); do
            PKG=$(rpm -qf "$(find / -name "$lib" 2>/dev/null | head -1)" 2>/dev/null || true)
            if [ -n "$PKG" ]; then
                sudo dnf install -y "$PKG" 2>/dev/null || true
            fi
        done
    fi
    
    # Recheck
    STILL_MISSING=$(ldd "$SCRIPT_DIR/localsend_app" 2>&1 | grep "not found" || true)
    if [ -n "$STILL_MISSING" ]; then
        echo ""
        echo "ERROR: 以下库仍然缺失，请手动安装:"
        echo "$STILL_MISSING"
        echo ""
        echo "在银河麒麟系统上可以尝试:"
        echo "  sudo apt-get install libgtk-3-0 libglib2.0-0 libnss3 libsecret-1-0"
        echo "  sudo apt-get install libayatana-appindicator3-1"
        echo ""
        echo "或者将以下信息发送给开发者以便排查:"
        echo "  ldd 输出:"
        ldd "$SCRIPT_DIR/localsend_app" 2>&1
        exit 1
    fi
else
    echo "所有库依赖检查通过"
fi

echo ""
echo "=== 启动 LocalSend ==="

# Launch the application
exec "${SCRIPT_DIR}/localsend_app" "$@" 2>&1 | while IFS= read -r line; do
    echo "$line"
    # If we see GLIBC version error, print helpful message
    if echo "$line" | grep -q "GLIBC"; then
        echo ""
        echo "ERROR: glibc版本不兼容"
        echo "本程序需要更高版本的glibc，请升级系统或联系开发者"
        echo "当前glibc版本: $(ldd --version 2>&1 | head -1)"
    fi
done
SCRIPT
          chmod +x "$BUNDLE_DIR/localsend.sh"

      - name: Create diagnostic script
        shell: bash
        run: |
          BUNDLE_DIR="app/build/linux/x64/release/bundle"
          cat > "$BUNDLE_DIR/diagnose.sh" << 'DIAG'
#!/bin/bash
# LocalSend 诊断脚本 - 收集系统信息用于问题排查
echo "=========================================="
echo "LocalSend 系统诊断"
echo "=========================================="
echo ""
echo "=== 系统信息 ==="
echo "操作系统: $(cat /etc/os-release 2>/dev/null | grep PRETTY_NAME | cut -d'"' -f2 || echo 'Unknown')"
echo "内核: $(uname -r)"
echo "架构: $(uname -m)"
echo ""
echo "=== glibc版本 ==="
ldd --version 2>&1 | head -1
echo ""
echo "=== 显示环境 ==="
echo "DISPLAY: ${DISPLAY:-未设置}"
echo "WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-未设置}"
echo "XDG_SESSION_TYPE: ${XDG_SESSION_TYPE:-未设置}"
echo "XDG_CURRENT_DESKTOP: ${XDG_CURRENT_DESKTOP:-未设置}"
echo ""
echo "=== GTK版本 ==="
dpkg -l | grep libgtk-3 2>/dev/null || rpm -qa | grep gtk 2>/dev/null || echo "无法检测"
echo ""
echo "=== 库依赖检查 ==="
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
ldd "$SCRIPT_DIR/localsend_app" 2>&1
echo ""
echo "=== 缺失的库 ==="
MISSING=$(ldd "$SCRIPT_DIR/localsend_app" 2>&1 | grep "not found" || echo "无缺失")
echo "$MISSING"
echo ""
echo "=== glibc符号要求 ==="
readelf -V "$SCRIPT_DIR/localsend_app" 2>/dev/null | grep GLIBC || echo "无法读取"
echo ""
echo "=== 字体检查 ==="
fc-list 2>/dev/null | grep -iE "noto|wenquanyi|cjk" | head -5 || echo "未找到中文字体"
echo ""
echo "=== 磁盘空间 ==="
df -h "$SCRIPT_DIR" 2>/dev/null || true
echo ""
echo "=========================================="
echo "请将以上信息发送给开发者以便排查问题"
echo "=========================================="
DIAG
          chmod +x "$BUNDLE_DIR/diagnose.sh"

      - name: Create README
        shell: bash
        run: |
          BUNDLE_DIR="app/build/linux/x64/release/bundle"
          cat > "$BUNDLE_DIR/README_LINUX.txt" << 'README'
LocalSend Linux 便携版 - 银河麒麟系统专用版
============================================

【运行方法】
方法1（推荐）: 
  1. 解压压缩包到任意目录
  2. 在终端中运行: ./localsend.sh

方法2:
  1. 如果方法1失败，运行诊断脚本: ./diagnose.sh
  2. 将诊断输出发送给开发者

【遇到问题时】
1. 运行诊断脚本: ./diagnose.sh
2. 检查缺失的库: ldd localsend_app | grep "not found"
3. 安装缺失依赖: sudo apt-get install libgtk-3-0 libglib2.0-0 libnss3

【系统要求】
- Linux x86_64
- glibc 2.31 或更高版本
- GTK 3.20 或更高版本

【银河麒麟系统特殊说明】
- 本版本在Ubuntu 20.04上编译，glibc版本为2.31
- 已内置大部分共享库，减少对系统库的依赖
- 如果您的系统glibc版本低于2.31，可能需要升级系统
- 查看glibc版本: ldd --version

【字体问题】
如果中文显示为方块:
  sudo apt-get install fonts-wqy-microhei fonts-noto-cjk

【托盘图标问题】
如果托盘图标不显示:
  sudo apt-get install libayatana-appindicator3-1

【Wayland用户】
如果使用Wayland会话，修改启动脚本中的:
  export GDK_BACKEND=x11
改为:
  export GDK_BACKEND=wayland
README

      - name: Create tar.gz archive
        run: |
          cd app/build/linux/x64/release/bundle
          tar -czvf "${{ github.workspace }}/LocalSend_Linux_Portable.tar.gz" .

      - name: Upload Linux portable
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable-ubuntu2004
          path: LocalSend_Linux_Portable.tar.gz
          retention-days: 30

      - name: Verify build
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo "=== Build Verification ==="
          BUNDLE_DIR="app/build/linux/x64/release/bundle"
          echo "Bundle contents:"
          find "$BUNDLE_DIR" -type f | sort | while read -r f; do
            size=$(stat -c%s "$f" 2>/dev/null || echo "?")
            echo "  $(echo $f | sed "s|$BUNDLE_DIR/||") ($size bytes)"
          done
          echo ""
          echo "Bundled libraries:"
          ls -la "$BUNDLE_DIR/lib/" 2>/dev/null
          echo ""
          echo "glibc requirements:"
          readelf -V "$BUNDLE_DIR/localsend_app" 2>/dev/null | grep GLIBC | head -10
          true

  # Job 2: Build in Docker with even older base for maximum compatibility
  build_docker:
    name: Linux (Docker / glibc compatible)
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build in Docker container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.linux
          tags: localsend-linux:latest
          load: true
          build-args: |
            FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
            RUST_VERSION=${{ env.RUST_VERSION }}

      - name: Extract build from Docker image
        run: |
          mkdir -p /tmp/extract
          docker create --name extract localsend-linux:latest
          docker cp extract:/app/build/linux/x64/release/bundle /tmp/extract/bundle
          docker rm extract
          ls -la /tmp/extract/bundle/

      - name: Bundle additional libraries
        shell: bash
        run: |
          set +e
          BUNDLE_DIR="/tmp/extract/bundle"
          mkdir -p "$BUNDLE_DIR/lib"
          
          # Extract libraries from the Docker image
          docker create --name libextract localsend-linux:latest
          
          # Copy all shared libraries from the container
          docker cp libextract:/usr/lib/x86_64-linux-gnu /tmp/container_libs 2>/dev/null || true
          docker cp libextract:/lib/x86_64-linux-gnu /tmp/container_libs2 2>/dev/null || true
          docker rm libextract
          
          # Copy needed libraries
          for libdir in /tmp/container_libs /tmp/container_libs2; do
            if [ -d "$libdir" ]; then
              for so in "$libdir"/lib*.so*; do
                [ -f "$so" ] && cp "$so" "$BUNDLE_DIR/lib/" 2>/dev/null || true
              done
            fi
          done
          true
          
          echo "Bundled libraries: $(ls "$BUNDLE_DIR/lib/" 2>/dev/null | wc -l)"

      - name: Create launch script
        shell: bash
        run: |
          BUNDLE_DIR="/tmp/extract/bundle"
          cat > "$BUNDLE_DIR/localsend.sh" << 'SCRIPT'
#!/bin/bash
set -e
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
export LD_LIBRARY_PATH="${SCRIPT_DIR}/lib:${SCRIPT_DIR}:${LD_LIBRARY_PATH}"
export GDK_BACKEND=x11
export GTK_CSD=0
export QT_AUTO_SCREEN_SCALE_FACTOR=1

if [ -z "$DISPLAY" ] && [ -z "$WAYLAND_DISPLAY" ]; then
    echo "ERROR: No display found."
    exit 1
fi

# Check for missing libs
MISSING=$(ldd "$SCRIPT_DIR/localsend_app" 2>&1 | grep "not found" || true)
if [ -n "$MISSING" ]; then
    echo "Missing libraries:"
    echo "$MISSING"
    echo ""
    echo "Run ./diagnose.sh for more info"
    exit 1
fi

exec "${SCRIPT_DIR}/localsend_app" "$@"
SCRIPT
          chmod +x "$BUNDLE_DIR/localsend.sh"
          
          # Create diagnostic script
          cat > "$BUNDLE_DIR/diagnose.sh" << 'DIAG'
#!/bin/bash
echo "=== LocalSend Diagnostics ==="
echo "OS: $(cat /etc/os-release 2>/dev/null | grep PRETTY_NAME | cut -d'"' -f2 || echo 'Unknown')"
echo "Kernel: $(uname -r)"
echo "glibc: $(ldd --version 2>&1 | head -1)"
echo "DISPLAY: ${DISPLAY:-not set}"
echo "WAYLAND: ${WAYLAND_DISPLAY:-not set}"
echo ""
echo "=== Library Check ==="
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
ldd "$SCRIPT_DIR/localsend_app" 2>&1
echo ""
echo "=== Missing Libraries ==="
ldd "$SCRIPT_DIR/localsend_app" 2>&1 | grep "not found" || echo "None"
echo ""
echo "=== GLIBC Requirements ==="
readelf -V "$SCRIPT_DIR/localsend_app" 2>/dev/null | grep GLIBC || echo "N/A"
DIAG
          chmod +x "$BUNDLE_DIR/diagnose.sh"

      - name: Create tar.gz archive
        run: |
          cd /tmp/extract/bundle
          tar -czvf "${{ github.workspace }}/LocalSend_Linux_Docker.tar.gz" .

      - name: Upload Docker build
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable-docker
          path: LocalSend_Linux_Docker.tar.gz
          retention-days: 30
