name: localsend_app
description: An open source cross-platform alternative to AirDrop
homepage: https://localsend.org/
publish_to: "none"

version: 1.17.0+58

environment:
  # Win7 兼容构建分支: 使用最后支持 Windows 7 的 Flutter 3.22 (Dart 3.4)
  flutter: ^3.22.0
  sdk: ^3.4.0

dependencies:
  collection: 1.18.0
  connectivity_plus: ^6.0.0
  crypto: ^3.0.7
  dart_mappable: ^4.2.0
  desktop_drop: ^0.6.0
  device_apps: 2.2.0
  device_info_plus: ^10.1.0
  dynamic_color: ^1.7.0
  file_picker: ^9.2.0
  file_selector: ^1.0.0
  flex_color_picker: ^3.5.0
  flutter:
    sdk: flutter
  flutter_displaymode: ^0.6.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.4
  freezed_annotation: ^2.4.0
  glob: 2.1.2
  image: ^4.1.0
  image_picker: ^1.1.0
  in_app_purchase: ^3.2.0
  intl: ^0.19.0
  local_hero: ^0.3.0
  localsend_isolates:
    path: ../packages/localsend_isolates
  logging: 1.3.0
  mime: 2.0.0
  moform: ^0.2.10
  nanoid2: 2.0.1
  network_info_plus: ^6.0.0
  open_dir: 0.0.2+1
  open_filex: ^4.4.0
  package_info_plus: ^8.0.0
  pasteboard: 0.3.0
  path: 1.9.0
  path_provider: ^2.1.2
  path_provider_foundation: 2.6.0
  permission_handler: ^11.3.0
  pretty_qr_code: ^3.3.0
  refena_flutter: ^2.1.1
  refena_inspector_client: ^2.0.0
  routerino: ^0.8.0
  saf_stream: ^2.0.0
  screen_retriever: ^0.1.9
  share_handler: 0.0.20
  shared_preferences: ^2.3.0
  shared_preferences_platform_interface: any
  slang: ^4.4.1
  slang_flutter: ^4.4.1
  system_settings_2: ^3.0.2
  tray_manager: ^0.4.0
  uri_content: ^3.0.0
  url_launcher: ^6.2.0
  uuid: ^4.4.0
  wakelock_plus: ^1.2.0
  wechat_assets_picker: ^9.0.0
  win32_registry: ^1.1.0
  window_manager: ^0.4.0
  windows_taskbar: ^1.1.0
  yaru: ^4.0.0

dev_dependencies:
  # Win7 分支: 以下版本兼容 Dart 3.4 (Flutter 3.22)
  build_runner: ^2.4.0
  dart_mappable_builder: ^4.2.0
  flutter_gen_runner: ^5.4.0
  flutter_lints: ^4.0.0
  freezed: ^2.5.0
  mockito: ^5.4.4
  refena_inspector: ^2.0.0
  slang_build_runner: ^4.4.1
  test: 1.25.2

dependency_overrides:
  path_provider_foundation: 2.4.1 # Win7: 覆盖为兼容 Dart 3.4 版本
  device_apps:
    # Migrate to another maintained package to fetch installed apps on Android
    git:
      url: https://github.com/Tienisto/device_apps.git
      ref: 5dc7956d938541254d2e175766b3b84ea38bb85b
  pasteboard:
    # This is temporary workaround, wait upstream for update
    git:
      url: https://github.com/Seidko/flutter-plugins.git
      ref: 58748dae405df5e68a131e4905d48e75d0624be2
      path: packages/pasteboard
  permission_handler_windows:
    # Remove windows support as it causes trouble with Windows 7
    # https://github.com/Baseflow/flutter-permission-handler/issues/1034
    git:
      url: https://github.com/localsend/permission_handler_windows_noop.git
      ref: 2dadd8afbf81e0e3e4791d7144e689555e58f649

flutter:
  uses-material-design: true

  assets:
    - assets/img/
    - assets/CHANGELOG.md

  fonts:
    - family: WenQuanYi Micro Hei
      fonts:
        - asset: assets/fonts/wqy-microhei.ttc

flutter_gen:
  line_length: 150
